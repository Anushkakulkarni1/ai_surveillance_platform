name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check formatting (black --check)
        run: |
          black --check --diff coordinates.py frame_buffer.py threshold_metrics.py tests/ conftest.py

      - name: Lint (flake8)
        run: |
          flake8 coordinates.py frame_buffer.py threshold_metrics.py tests/ conftest.py

      - name: Run tests (pytest)
        run: |
          pytest tests/ -v --tb=short

      - name: Publish test summary
        if: always()
        run: |
          echo "### Test run complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Python 3.10 · black --check · flake8 · pytest tests/" >> "$GITHUB_STEP_SUMMARY"
